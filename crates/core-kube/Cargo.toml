[package]
name = "opspilot-core-kube"
description = "Kubernetes: kubeconfig contexts, informer-backed resource lists, logs and exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# §16 dependency note: kube + k8s-openapi are the largest addition in this
# module set (~4–6 MB of release binary, mostly generated API types). TLS is
# rustls with the `ring` provider — NOT aws-lc-rs, which needs NASM to build on
# Windows (CLAUDE.md §18.7). `ws` is for exec. Nothing initialises until the
# Kubernetes module is first opened (§14.5).
kube = { version = "5", default-features = false, features = ["client", "config", "rustls-tls", "ring", "runtime", "ws"] }
# The oldest API version kube 5 supports; newer servers serve it too.
k8s-openapi = { version = "0.29", default-features = false, features = ["v1_33"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
serde-saphyr = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Test-only, to build an upgrade error with a status code. Already in the tree
# through kube, so it adds nothing to the build or the binary.
http = "1"
