[package]
name = "opspilot-app"
description = "Tauri commands and wiring for OpsPilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tauri.workspace = true
serde.workspace = true

# The terminal engine. No longer optional: a session IS a terminal, so there is
# no configuration in which the app is useful without it.
opspilot-core-term = { path = "../core-term" }

# SSH and SFTP. Feature-gating this per §3 was considered and rejected: a tool
# whose name is "unified engineering workspace" has no configuration in which
# remote access is optional, and gating it would mean two build shapes to test.
opspilot-core-ssh = { path = "../core-ssh" }
opspilot-core-store = { path = "../core-store" }
opspilot-core-docker = { path = "../core-docker" }
# The transfer engine (§6). Not feature-gated, for the reason given for
# core-ssh above: SFTP is part of remote access. New code: core-sftp itself and
# the `tar` crate (pure Rust, no default features). Nothing runs at startup.
opspilot-core-sftp = { path = "../core-sftp" }
opspilot-core-db = { path = "../core-db" }
opspilot-core-kube = { path = "../core-kube" }
# Only for the `kube::Client` type held in the per-context cache; the version
# and features are set in core-kube.
kube = { version = "5", default-features = false }
# `sync` for the oneshot that carries a clipboard read back from the GTK main
# thread. A feature of a crate already linked, not a new dependency.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# PTY. CLAUDE.md §16 requires a note on any new dependency:
#   portable-pty (from wezterm) wraps ConPTY on Windows and openpty elsewhere.
#   ~90 KB of the release binary and no startup cost — nothing initialises until
#   a session is opened. The alternative is writing ConPTY FFI by hand, and
#   §5.9 is already explicit that ConPTY is a source of subtle trouble that is
#   "not your bug to fix in Rust".
portable-pty = "0.8"

# Linux clipboard, including PRIMARY (crate::clipboard). §16 note: zero cost —
# Tauri already links gtk 0.18 on Linux for the window itself, so this only
# makes the dependency nameable. Version must track Tauri's (see Cargo.lock).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The GPU terminal (crate::gpu_term): wgpu, swash and the embedded font (~520 KB
# of TTF). Release size cost NOT yet measured (COMPLETED.md, Phase 20). Nothing runs
# until a terminal pane attaches; then device creation is tens of ms on a
# background thread. gdkx11 is already linked by Tauri; it names the X window.
# Linux only for now: the child-window approach is X11-specific.
opspilot-render = { path = "../render" }
gdkx11 = "0.18"
# Test harness only (crate::latency_probe, feature `latency-probe`): reads the
# window's pixels on a second X connection. Not in a normal build.
x11rb = { version = "0.14", optional = true }
# The same harness over a slow SSH link: a throwaway sshd, private agent and
# delay proxy (`OPSPILOT_PROBE_RTT_MS`). Also a dev-dependency; never shipped.
opspilot-test-sshd = { path = "../test-sshd", optional = true }

[features]
# Keystroke → pixel latency harness on the real display. See latency_probe.rs.
latency-probe = ["dep:x11rb", "dep:opspilot-test-sshd"]

# poll() on the PTY and killpg() on close (session.rs). Already linked through
# portable-pty and tokio: no new code in the binary.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
# Test-only: the live SSH harness (tests/live_ssh.rs). Real sshd, agent and a
# latency proxy from the shared fixture crate; nothing reaches the binary.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros"] }
opspilot-test-sshd = { path = "../test-sshd" }

